<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Trendit | Lebanon's Premium Marketplace</title>
    <meta name="title" content="Trendit | Lebanon's Premium Marketplace" />
    <meta name="description" content="The largest refined marketplace in Lebanon. Curated quality products from local and international brands, delivered in record time to your doorstep." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trendit.lb/" />
    <meta property="og:title" content="Trendit | Lebanon's Premium Marketplace" />
    <meta property="og:description" content="The largest refined marketplace in Lebanon. Curated quality products, delivered in record time." />
    <meta property="og:image" content="/hero-bg.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://trendit.lb/" />
    <meta property="twitter:title" content="Trendit | Lebanon's Premium Marketplace" />
    <meta property="twitter:description" content="The largest refined marketplace in Lebanon. Curated quality products, delivered in record time." />
    <meta property="twitter:image" content="/hero-bg.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230452C8%22/><circle cx=%2250%22 cy=%2250%22 r=%2225%22 fill=%22white%22/></svg>" />

    <style>
      /* Initial Splash Screen Style */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        transition: opacity 0.5s ease-out, visibility 0.5s;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .loader-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #2563eb, #818cf8);
        border-radius: 0 32px 0 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        animation: pulse 2s infinite ease-in-out;
      }
      .loader-logo div {
        width: 40px;
        height: 40px;
        background: white;
        border-radius: 50%;
      }
      .loader-text {
        font-weight: 900;
        font-size: 32px;
        letter-spacing: -0.05em;
        color: #0f172a;
        text-transform: uppercase;
      }
      .loader-text span { color: #0452C8; }
      
      @keyframes pulse {
        0%, 100% { transform: scale(0.9) rotate(-12deg); opacity: 0.8; }
        50% { transform: scale(1) rotate(12deg); opacity: 1; }
      }

      /* Hide loader when app is ready */
      .app-ready #initial-loader {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-logo"><div></div></div>
      <div class="loader-text">Trendit<span>.</span></div>
    </div>

    <div id="root">
      <!-- Non-JS Fallback / SEO Content -->
      <div style="padding: 40px; text-align: center; font-family: sans-serif;">
        <h1>Trendit Lebanon</h1>
        <p>Premium Marketplace. Delivering Everything You Need, Fast.</p>
        <noscript>
          <p style="color: #64748b;">This application requires JavaScript to function properly. Please enable it in your browser settings.</p>
        </noscript>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Signal when the app is ready to hide the loader
      window.addEventListener('load', () => {
        // We delay slightly to ensure React has started mounting
        setTimeout(() => {
          document.body.classList.add('app-ready');
        }, 300);
      });
    </script>
  </body>
</html>
